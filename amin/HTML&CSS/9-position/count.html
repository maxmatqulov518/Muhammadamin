<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *,
        html {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .div1{
            padding: 30px;
            justify-content:center;
            align-items:center;
            background-color: white;
            width: 400px;
            border-radius: 10px;
            margin: 100px auto;

        }
        body{
            background-color: aliceblue;
            font-family: Arial, Helvetica, sans-serif;
        }
        img{
            border-radius: 10px;
            border-bottom: 10px;
            width: 340px;
        }
        h1{
            padding-bottom: 7px;
            font-size: 25px;
            color: black;
        }
        .we{
            color: gray;
            font-size: 17px;
            margin-bottom: 10px;
        }
        .qwe{
            margin-bottom: 10px;
        }
        span{
            color: black;
        }
        h2{
            padding-bottom: 7px;
            font-size: 25px;
            color: black;
        }
        button  {width: 100%;
            color: white;
            background-color: blueviolet;
            margin-top: 8px;
            border-radius: 10px;
            border: none;
            padding: 20px;
}
.relative-box {
            position: absolute;
            top: 135px;
            right: 1010px;
            background-color: purple;
            padding: 10px;
            border-radius: 10px;
            color: white;
        }
    </style>
</head>
<body>
    <div class="div1">
        <img src="https://www.udacity.com/blog/wp-content/uploads/2020/06/HTML_Blog-scaled.jpeg" alt="">
        <h1>Frontend Development with</h1>
        <h2>JavaScript</h2>
        <p class="we">By Cristain munoz</p>
        <p class="qwe"><span>8</span> Duration:7 weeks</p>
        <p>$80.00 USD 80% discount</p>
        <button>Buy now $14.00 USD</button> 
    </div>
    <div class="relative-box">Development</div>
</body>
</html>
