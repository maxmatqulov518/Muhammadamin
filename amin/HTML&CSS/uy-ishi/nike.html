<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *,
        html{
            margin: 0;
            padding: 0;
        }
        header{
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 200px;
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(243,245,255);
        }
        section{
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 200px;
        }
        a{
            color: black;
            text-decoration: none;
            margin-left: 15px;
        }
        button{
            background-color: black;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            margin-left: 15px;
            margin-top: 5px;
        }
        img{
            width: 250px;
        }
        div{
            width: 300px;
            height: 350px;
            background-color: red;
            border-radius: 15px;
            text-align: center;
            color: white;
        }
        p{
            font-size: 12px;
            margin-top: 5px;
        }
        .div1{
            background-color: red;
        }
        .div2{
            background-color: lightskyblue;
        }
        .div3{
            background-color:green;
        }
        div:hover{
            scale: 1.1;
        }
    </style>
</head>
<body>
    <header>
        <h1 class="logo">Nike</h1>
        <nav>
            <a href="">Home</a>
            <a href="">Ship</a>
            <a href="">Sale</a>
            <button>Sign In</button>
        </nav>
    </header>
    <section>
        <div class="div1">
            <img src="https://i.ibb.co/cNWqxGx/red.png" alt="">
            <h2>Nike X OFF-white</h2>
            <p>The 10: Air Jordan 1 off-white - Chicago</p>
            <p>$999</p>
            <button>Buy Now</button>
            <button>⭐</button>
        </div>
        <div class="div2">
            <img src="https://i.ibb.co/0JKpmgd/blue.png" alt="">
            <h2>Nike X OFF-white</h2>
            <p>Air Jordan 1 Retro High "Off-White - UNC" sneakers</p>
            <p>$1599</p>
            <button>Buy Now</button>
            <button>⭐</button>
        </div>
        <div class="div3">
            <img src="https://i.ibb.co/cNWqxGx/red.png" alt="">
            <h2>Nike X OFF-white</h2>
            <p>Air Jordan 1 custom green edition sneakers</p>
            <p>$1299</p>
            <button>Buy Now</button>
            <button>⭐</button>
        </div>
    </section>
</body>
</html>
