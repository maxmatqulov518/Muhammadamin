<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *,
        html{
        margin: 0;
        padding: 0; 
        font-family: sans-serif;
        }
        header{
            background-color: black;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            
        }
        nav{
            width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        ul{
            display: flex;
            gap: 15px;
            list-style: none;
        }
        .logo_div{
            font-weight: bold;
            font-size: 22px;
        }
        .sign{
            background-color: black;
            color: white;
            border: 2px solid white;
            padding: 10px;
        }
        .login{
            background-color: rgb(255, 255, 255);
            color: rgb(0, 0, 0);
            border: 2px solid rgb(0, 0, 0);
            padding: 10px 17px;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="loga_div">LOGO</div>
            <ul>
                <li>Home</li>
                <li>services</li>
                <li>blog</li>
                <li>helg</li>
                <li>help</li>
            </ul>
            <input type="text">
            <div>
                <button class="sign">Sign In</button>
                <button class="login">Login</button>
            </div>
        </nav>
    </header>
</body>
</html>
