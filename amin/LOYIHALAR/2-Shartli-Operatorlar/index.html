<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Kayfiyat Emojisi</title>
  <style>
    body {
      text-align: center;
      margin-top: 80px;
      font-family: Arial;
      background: #111;
      color: white;
    }
    button {
      padding: 15px 30px;
      font-size: 20px;
      cursor: pointer;
    }
    #emoji {
      font-size: 100px;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <h2>Bugungi kayfiyatingiz?</h2>

  <button onclick="kayfiyatTekshir()">Kayfiyatni tekshirish</button>

  <div id="emoji"></div>

  <script>
    function kayfiyatTekshir() {
      var kayfiyat = prompt("Bugun kayfiyatingiz qanday? (yaxshi / yomon)");

      if (kayfiyat == "yaxshi") {
        document.getElementById("emoji").innerText = "😊";
      }
      else if (kayfiyat == "yomon") {
        document.getElementById("emoji").innerText = "😢";
      }
      else {
        console.log("Xato kiritildi: " + kayfiyat);
        alert("Faqat 'yaxshi' yoki 'yomon' deb yozing!");
      }
    }
  </script>

</body>
</html>
