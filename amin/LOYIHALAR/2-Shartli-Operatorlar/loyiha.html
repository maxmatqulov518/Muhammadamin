<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
        body{
            background-color: teal;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .katta-div{
            background-color: white;
            width: 100%;
            max-width: 440px;
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }
        .ulash-tugmalari{
            display: flex;
            background-color: white;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 28px;
        }
        button{
            color: teal;
            width: 50%;
            padding: 10px 16px;
            border: none;
            background: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
        .faol-tugma{
            background-color: teal;
            color: white;
        }
        .forma-tavsif{
            font-size: 14px;
            color: grey;
            margin-bottom: 24px;
        }
        .kirish-guruhi{
            margin-bottom: 18px;
        }
        label{
            font-size: 14px;
            font-weight: 700;
            color:teal;
            margin-bottom: 8px;
                        display: block;

        }
        input{
            width: 100%;
            padding: 12px 16px;
            border: 1px solid white;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }
        input:focus {
            border-color: #12635b;
        }
        .asosiy-tugma{
            background-color: teal;
            color: white;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            margin-top: 8px;
            margin-bottom: 20px;
             width: 100%;
        }
        .asosiy-tugma:hover {
            background-color: teal;
        }
        .paski-matn{
            text-align: center;
            font-size: 13px;
            color: gray;
        }
        .paski-matn a{
            color: teal;
            font-weight: 700;
            text-decoration: none;
        }
        .yashirin{
            display: flex;
        }
    </style>
</head>
<body>
    <div class="katta-div">
        <div class="button-divs">
            <button onclick="kirish()" id="kirish-tab" class="faol-tugma">Log in</button>
            <button onclick="chiqish()" id="royxat-tab">Create account</button>
        </div>
        <div id="kirish-firmasi" class="yashirin">
            <h1 class="forma-sarlavha">Hush kelibsiz</h1>
            <p class="forma-tavsif">Loyihalaringizni boshqarish uchun tizimga kiring.</p>

            <div class="kiritish-guruhi">
                <label>Email</label>
                <input type="email" placeholder="you@example.com" required>
            </div>

            <div class="kiritish-guruhi">
                <label>Parol</label>
                <input type="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="asosiy-tugma">Kirish</button>

            <div class="paski-matn">
                <a href="#">Parolni unutdingizmi?</a>
            </div>
        </div>
        <div id="royxat-firmasi">
            <h1 class="forma-sarlavha">Hisobingizni yarating</h1>
            <p class="forma-tavsif">14 kun bepul. Bank kartasi talab qilinmaydi.</p>

            <div class="kiritish-guruhi">
                <label>To'liq ismingiz</label>
                <input type="text" placeholder="Ism Familiya" required>
            </div>

            <div class="kiritish-guruhi">
                <label>Email</label>
                <input type="email" placeholder="you@example.com" required>
            </div>

            <div class="kiritish-guruhi">
                <label>Parol</label>
                <input type="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="asosiy-tugma">Hisob ochish</button>

            <div class="paski-matn">
                Ro'yxatdan o'tish orqali siz <a href="#">Shartlarga</a> rozilik bildirasiz.
            </div>
        </div>
    </div>

    <script>
        let kirishTab = document.getElementById('kirish-tab');
        let royxatTab = document.getElementById('royxat-tab');
        let kirishFormasi = document.getElementById('kirish-firmasi');
        let royxatFormasi = document.getElementById('royxat-firmasi');

        function chiqish() {
            royxatTab.classList.add('faol-tugma');
            kirishTab.classList.remove('faol-tugma');
            royxatFormasi.classList.remove('yashirin');
            kirishFormasi.classList.add('yashirin');
        }
        function kirish() {
            kirishTab.classList.add('faol-tugma');
            royxatTab.classList.remove('faol-tugma');
            kirishFormasi.classList.remove('yashirin');
            royxatFormasi.classList.add('yashirin');
        }
    </script>
</body>
</html>
