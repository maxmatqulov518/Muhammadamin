<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Valyuta Konvertori</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 320px;
            text-align: center;
        }

        .box h2 {
            color: #333;
            margin-bottom: 20px;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #4CAF50;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            font-weight: 900;
        }

        button:hover {
            background-color: #45a049;
        }

        h3 {
            margin-top: 20px;
            margin-bottom: 5px;
            color: #333;
            font-size: 15px;
        }

        #natija {
            font-size: 18px;
            font-weight: bold;
            color: #2e7d32;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>Konvertor</h2>
        
        <label>Miqdor:</label>
        <input type="number" id="miqdor" value="100">

        <label>Yo'nalish:</label>
        <select id="turi">
            <option value="rubToUsd">Rubl -> Dollar</option>
            <option value="usdToRub">Dollar -> Rubl</option>
        </select>

        <button onclick="hisobla()">Hisoblash</button>

        <h3>Natija:</h3>
        <p id="natija">--</p>
    </div>
    <script src="script6.js"></script>
</body>
</html>
