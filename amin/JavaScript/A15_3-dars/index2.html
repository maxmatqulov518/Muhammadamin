<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Profil kartochkasi</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #cfcfcf;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 25px;
    flex-wrap: wrap;
    padding: 30px;
    font-family: Arial, sans-serif;
  }
  .card {
    width: 220px;
    background: #fff;
    border-radius: 20px;
    padding: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
  }
  .photo {
    width: 100%;
    height: 220px;
    border-radius: 14px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .name {
    font-size: 17px;
    font-weight: bold;
    margin-top: 12px;
    color: #111;
  }
  .desc {
    font-size: 12px;
    color: #888;
    margin-top: 6px;
    line-height: 1.4;
  }
  .bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 15px;
  }
  .stats {
    display: flex;
    gap: 12px;
  }
  .stat {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: #555;
    white-space: nowrap;
  }
  button {
    border: none;
    border-radius: 20px;
    padding: 7px 16px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
  }
  .follow {
    background: #f1f1f1;
    color: #333;
  }
  .unfollow {
    background: #3fae5c;
    color: #fff;
  }
</style>
</head>
<body>

<div class="card">
  <div class="photo">
    <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="Jack Lawson">
  </div>
  <div class="name">Jack Lawson</div>
  <div class="desc">UI/UX designer focused on simple, usable, & intuitive experiences.</div>
  <div class="bottom">
    <div class="stats">
      <div class="stat">👤 154</div>
      <div class="stat">💼 34</div>
    </div>
    <button class="follow">Follow</button>
  </div>
</div>

<div class="card">
  <div class="photo">
    <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="Jack Lawson">
  </div>
  <div class="name">Jack Lawson</div>
  <div class="desc">UI/UX designer focused on simple, usable, & intuitive experiences.</div>
  <div class="bottom">
    <div class="stats">
      <div class="stat">👤 154</div>
      <div class="stat">💼 34</div>
    </div>
    <button class="unfollow">Unfollow</button>
  </div>
</div>

</body>
</html>
